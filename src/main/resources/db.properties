# =============================================================
#  Configuracion de la base de datos de Nero Thread
# -------------------------------------------------------------
#  Por defecto se usa SQLite (archivo nerothread.db), que no
#  requiere instalar nada. Las tablas y los datos de ejemplo se
#  crean automaticamente la primera vez que se ejecuta la app.
#
#  Para usar MySQL:
#   1. Ejecuta database/neroshop_mysql.sql en MySQL Workbench.
#   2. Copia este archivo a la carpeta raiz del proyecto
#      (junto a pom.xml) con el nombre db.properties.
#   3. Comenta las lineas de SQLite y descomenta las de MySQL.
# =============================================================

# --- SQLite (por defecto) ---
db.url=jdbc:sqlite:nerothread.db
db.user=
db.password=

# --- MySQL ---
#db.url=jdbc:mysql://localhost:3306/nerothread?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#db.user=root
#db.password=tu_password
